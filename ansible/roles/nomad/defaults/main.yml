---
nomad_datacenter: "{{ datacenter }}"
nomad_region: "{{ nomad_region_name | default('global') }}"
nomad_is_server: "{{ inventory_hostname in (groups['nomad_server'] | default([])) }}"
nomad_is_client: "{{ inventory_hostname in (groups['nomad_client'] | default([])) }}"
nomad_server_hosts: >-
  {{ groups['nomad_server'] | default([])
     | map('extract', hostvars)
     | selectattr('datacenter', 'defined')
     | selectattr('datacenter', '==', nomad_datacenter)
     | map(attribute='inventory_hostname') | list
     or groups['nomad_server'] | default([]) }}
# Single address.
nomad_bind_address: "0.0.0.0"
nomad_consul_address: "127.0.0.1:8500"
nomad_data_dir: /opt/nomad/data
nomad_plugin_dir: /opt/nomad/plugins
nomad_node_meta:
  services: "{{ services | default([]) | join(',') }}"
# Units the systemd task driver may manage (Go regexps, unanchored).
nomad_systemd_driver_allowed_units: >-
  {{ webitel_services | dict2items
     | selectattr('value.nomad', 'defined')
     | map(attribute='value.units') | flatten
     | union(nomad_jobs_extra.values() | map(attribute='units') | flatten)
     | map('regex_escape')
     | map('regex_replace', '^(.*)$', '^\1\.service$') | list }}
nomad_keyring: /usr/share/keyrings/hashicorp-archive-keyring.gpg
nomad_apt_uri: https://apt.releases.hashicorp.com
nomad_apt_key_url: "{{ nomad_apt_uri }}/gpg"
nomad_tls_enabled: "{{ consul_pki_enabled | default(false) }}"
nomad_ca_file: "{{ pki_remote_dir }}/ca.pem"
nomad_cert_file: "{{ pki_remote_dir }}/{{ inventory_hostname }}.pem"
nomad_key_file: "{{ pki_remote_dir }}/{{ inventory_hostname }}-key.pem"

# --- Job submission (tasks/jobs.yml) ---
# Datacenter whose jobs run. Every other datacenter gets new jobs stopped and leaves existing
# ones as they are. Empty (several datacenters and no active_datacenter or primary_datacenter)
# means no datacenter is active.
nomad_jobs_active_datacenter: >-
  {%- set dcs = groups['nomad_client'] | default([]) | map('extract', hostvars)
                | selectattr('datacenter', 'defined') | map(attribute='datacenter') | unique | list -%}
  {{ active_datacenter | default(primary_datacenter | default(dcs | first if dcs | length == 1 else '', true), true) }}
nomad_jobs_api_url: "{{ 'https' if nomad_tls_enabled | bool else 'http' }}://127.0.0.1:4646"
# Capped by the client's max_kill_timeout (30s by default).
nomad_jobs_kill_timeout: 30s
# Service jobs only: how long a disconnected client keeps its units running.
nomad_jobs_stop_on_client_after: 30s
# Scheduler reservation only; MHz / MB.
nomad_jobs_task_cpu: 20
nomad_jobs_task_memory: 32
# Optional placement pin for service jobs: catalog service name -> Nomad node names,
# e.g. {opensips: [node1]}. Not allowed for system jobs, which select nodes by meta.services only.
nomad_jobs_node_constraints: {}
# meta.dcctl_stage of a job whose catalog entry has no nomad.stage: catalog service
# name -> stage. Start goes by ascending stage, stop by descending.
nomad_jobs_stages:
  freeswitch: 1
  rtpengine: 1
  webitel_storage: 2
  webitel_core: 2
  webitel_flow_manager: 2
  webitel_engine: 2
  webitel_call_center: 2
  webitel_messages: 2
  webitel_cases: 2
  webitel_logger: 2
  webitel_media_exporter: 2
  grafana: 2
  opensips: 3
  webitel_core_api: 3
  nginx_vip: 3
# Jobs of their own for units of a catalog service, or services without a nomad entry:
# job service name -> host_service (the catalog service whose hosts run it), units, nomad.
# The units are taken off the job of host_service. A catalog nomad entry of the same name wins.
nomad_jobs_extra:
  webitel_core_api:
    host_service: webitel_core
    units: [webitel-api]
    nomad: {type: service}
  nginx_vip:
    host_service: nginx_vip
    units: [webitel-nginx-vip]
    nomad: {type: service}
