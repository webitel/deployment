---
rabbitmq_user: "{{ webitel_amqp_user }}"
rabbitmq_password: "{{ webitel_amqp_password }}"
rabbitmq_disk_free_limit: 2GB
rabbitmq_listen_address: >-
  {{ '127.0.0.1' if single_node | default(false)
     else ansible_facts.default_ipv4.address }}
rabbitmq_cluster_hosts: >-
  {{ groups['rabbitmq'] | default([])
     | map('extract', hostvars)
     | selectattr('datacenter', 'defined')
     | selectattr('datacenter', '==', datacenter)
     | map(attribute='inventory_hostname') | list
     or groups['rabbitmq'] | default([]) }}
rabbitmq_keyring: /usr/share/keyrings/com.rabbitmq.team.asc
rabbitmq_launchpad_keyring: /usr/share/keyrings/net.launchpad.ppa.rabbitmq.erlang.asc
# Team RabbitMQ key; signs both the Erlang and the server repositories.
rabbitmq_apt_key_url: https://keys.openpgp.org/vks/v1/by-fingerprint/0A9AF2115F4687BD29803A206B73A36E6026DFCA
# Erlang on bookworm amd64; trixie takes Erlang from Debian main.
rabbitmq_erlang_apt_uris:
  - https://deb1.rabbitmq.com/rabbitmq-erlang/debian/bookworm
  - https://deb2.rabbitmq.com/rabbitmq-erlang/debian/bookworm
rabbitmq_server_apt_uris:
  - "https://deb1.rabbitmq.com/rabbitmq-server/debian/{{ ansible_facts.distribution_release }}"
  - "https://deb2.rabbitmq.com/rabbitmq-server/debian/{{ ansible_facts.distribution_release }}"
# Erlang on bookworm arm64.
rabbitmq_launchpad_apt_uri: https://ppa.launchpadcontent.net/rabbitmq/rabbitmq-erlang/ubuntu
rabbitmq_launchpad_apt_key_url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xB279943D2A549531E144B875F77F1EDA57EBB1CC
rabbitmq_erlang_cookie: "{{ vault_rabbitmq_erlang_cookie | default('WEBITELRABBITMQCOOKIE') }}"
rabbitmq_is_cluster: "{{ (rabbitmq_cluster_hosts | length) > 1 }}"
