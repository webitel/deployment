---
# Erlang source: bookworm amd64 - Team RabbitMQ repo, bookworm arm64 - Launchpad PPA (jammy), trixie - Debian main.
- name: Download Team RabbitMQ signing key
  ansible.builtin.get_url:
    url: https://keys.openpgp.org/vks/v1/by-fingerprint/0A9AF2115F4687BD29803A206B73A36E6026DFCA
    dest: "{{ rabbitmq_keyring }}"
    mode: "0644"
  register: rabbitmq_team_key
  until: rabbitmq_team_key is succeeded
  retries: 5
  delay: 2

- name: Add RabbitMQ Erlang repository (bookworm amd64)
  ansible.builtin.deb822_repository:
    name: rabbitmq-erlang
    types: [deb]
    uris:
      - "https://deb1.rabbitmq.com/rabbitmq-erlang/debian/bookworm"
      - "https://deb2.rabbitmq.com/rabbitmq-erlang/debian/bookworm"
    suites: bookworm
    components: main
    signed_by: "{{ rabbitmq_keyring }}"
    state: present
    enabled: true
  when:
    - ansible_facts.distribution_release == 'bookworm'
    - ansible_facts.architecture == 'x86_64'

- name: Download Launchpad PPA signing key (bookworm arm64)
  ansible.builtin.get_url:
    url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xB279943D2A549531E144B875F77F1EDA57EBB1CC
    dest: "{{ rabbitmq_launchpad_keyring }}"
    mode: "0644"
  register: rabbitmq_launchpad_key
  until: rabbitmq_launchpad_key is succeeded
  retries: 5
  delay: 2
  when:
    - ansible_facts.distribution_release == 'bookworm'
    - ansible_facts.architecture == 'aarch64'

- name: Add RabbitMQ Erlang Launchpad repository (bookworm arm64)
  ansible.builtin.deb822_repository:
    name: rabbitmq-erlang
    types: [deb]
    uris: "https://ppa.launchpadcontent.net/rabbitmq/rabbitmq-erlang/ubuntu"
    suites: jammy
    components: main
    signed_by: "{{ rabbitmq_launchpad_keyring }}"
    state: present
    enabled: true
  when:
    - ansible_facts.distribution_release == 'bookworm'
    - ansible_facts.architecture == 'aarch64'

- name: Add RabbitMQ server repository
  ansible.builtin.deb822_repository:
    name: rabbitmq-server
    types: [deb]
    uris:
      - "https://deb1.rabbitmq.com/rabbitmq-server/debian/{{ ansible_facts.distribution_release }}"
      - "https://deb2.rabbitmq.com/rabbitmq-server/debian/{{ ansible_facts.distribution_release }}"
    suites: "{{ ansible_facts.distribution_release }}"
    components: main
    signed_by: "{{ rabbitmq_keyring }}"
    state: present
    enabled: true

- name: Install rabbitmq-server
  ansible.builtin.apt:
    name: rabbitmq-server
    state: present
    install_recommends: false
    update_cache: true
  register: rabbitmq_installed
