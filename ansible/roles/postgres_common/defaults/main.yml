---
postgres_common_db: "{{ webitel_pg_db }}"
postgres_common_app_user: "{{ webitel_pg_user }}"
postgres_common_app_password: "{{ webitel_pg_password }}"
postgres_common_proxy_password: "{{ webitel_pg_proxy_password }}"
postgres_common_schema_files:
  - "/usr/share/postgresql/{{ pg_major }}/webitel/webitel-db-schema.sql"
  - "/usr/share/postgresql/{{ pg_major }}/webitel/webitel-db-data.sql"
postgres_common_reassign_owner_file: "/usr/share/postgresql/{{ pg_major }}/webitel/reassign-owner.sql"
postgres_common_opensips_proxy_file: "/usr/share/postgresql/{{ pg_major }}/webitel/opensips-proxy.sql"

postgres_common_base_packages:
  - "postgresql-{{ pg_major }}"
  - "timescaledb-2-postgresql-{{ pg_major }}"
  - "webitel-postgresql-{{ pg_major }}"
  - "webitel-postgresql-migrations-{{ pg_major }}"

postgres_common_pgdg_keyring: /usr/share/keyrings/postgresql.gpg
postgres_common_timescale_keyring: /usr/share/keyrings/timescaledb.gpg
postgres_common_pgdg_apt_uri: http://apt.postgresql.org/pub/repos/apt/
postgres_common_pgdg_apt_key_url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
postgres_common_timescale_apt_uri: https://packagecloud.io/timescale/timescaledb/debian/
postgres_common_timescale_apt_key_url: https://packagecloud.io/timescale/timescaledb/gpgkey

# Empty: peer auth; non-empty (e.g. 127.0.0.1): TCP.
postgres_common_login_host: ""
postgres_common_login_user: ""
postgres_common_login_password: ""
