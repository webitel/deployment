---
- name: Download PGDG GPG key
  vars:
    _mirror_auth: "{{ apt_mirror_host | length > 0 and (postgres_common_pgdg_apt_key_url | urlsplit('hostname')) == apt_mirror_host }}"
  ansible.builtin.get_url:
    url: "{{ postgres_common_pgdg_apt_key_url }}"
    url_username: "{{ apt_mirror_username if _mirror_auth | bool else omit }}"
    url_password: "{{ apt_mirror_password if _mirror_auth | bool else omit }}"
    force_basic_auth: "{{ _mirror_auth | bool }}"
    dest: /tmp/pgdg.asc
    mode: "0644"
    force: true
  register: postgres_common_pgdg_key

- name: Dearmor PGDG key
  ansible.builtin.command:
    cmd: gpg --batch --yes --dearmor -o /tmp/pgdg.dearmored /tmp/pgdg.asc
  changed_when: false
  check_mode: false

- name: Install PGDG key
  ansible.builtin.copy:
    src: /tmp/pgdg.dearmored
    dest: "{{ postgres_common_pgdg_keyring }}"
    remote_src: true
    mode: "0644"

- name: Download TimescaleDB GPG key
  vars:
    _mirror_auth: "{{ apt_mirror_host | length > 0 and (postgres_common_timescale_apt_key_url | urlsplit('hostname')) == apt_mirror_host }}"
  ansible.builtin.get_url:
    url: "{{ postgres_common_timescale_apt_key_url }}"
    url_username: "{{ apt_mirror_username if _mirror_auth | bool else omit }}"
    url_password: "{{ apt_mirror_password if _mirror_auth | bool else omit }}"
    force_basic_auth: "{{ _mirror_auth | bool }}"
    dest: /tmp/timescaledb.asc
    mode: "0644"
    force: true
  register: postgres_common_timescale_key

- name: Dearmor TimescaleDB key
  ansible.builtin.command:
    cmd: gpg --batch --yes --dearmor -o /tmp/timescaledb.dearmored /tmp/timescaledb.asc
  changed_when: false
  check_mode: false

- name: Install TimescaleDB key
  ansible.builtin.copy:
    src: /tmp/timescaledb.dearmored
    dest: "{{ postgres_common_timescale_keyring }}"
    remote_src: true
    mode: "0644"

- name: Add PGDG repository
  ansible.builtin.deb822_repository:
    name: postgresql
    types: [deb]
    uris: "{{ postgres_common_pgdg_apt_uri }}"
    suites: "{{ ansible_facts.distribution_release }}-pgdg"
    components: main
    signed_by: "{{ postgres_common_pgdg_keyring }}"
    state: present
    enabled: true

- name: Add TimescaleDB repository
  ansible.builtin.deb822_repository:
    name: timescaledb
    types: [deb]
    uris: "{{ postgres_common_timescale_apt_uri }}"
    suites: "{{ ansible_facts.distribution_release }}"
    components: main
    signed_by: "{{ postgres_common_timescale_keyring }}"
    state: present
    enabled: true

- name: Install PostgreSQL, TimescaleDB and webitel base packages
  ansible.builtin.apt:
    name: "{{ postgres_common_base_packages }}"
    state: present
    install_recommends: false
    update_cache: true
