---
- name: Create application user
  community.postgresql.postgresql_user:
    name: "{{ postgres_common_app_user }}"
    password: "{{ postgres_common_app_password }}"
    login_db: postgres
    login_host: "{{ postgres_common_login_host | default(omit, true) }}"
    login_user: "{{ postgres_common_login_user | default(omit, true) }}"
    login_password: "{{ postgres_common_login_password | default(omit, true) }}"
  become: true
  become_user: postgres

- name: Create webitel database
  community.postgresql.postgresql_db:
    name: "{{ postgres_common_db }}"
    owner: "{{ postgres_common_app_user }}"
    login_host: "{{ postgres_common_login_host | default(omit, true) }}"
    login_user: "{{ postgres_common_login_user | default(omit, true) }}"
    login_password: "{{ postgres_common_login_password | default(omit, true) }}"
  become: true
  become_user: postgres
  register: postgres_common_create_db

- name: Ensure webitel SQL directory is traversable
  ansible.builtin.file:
    path: "/usr/share/postgresql/{{ pg_major }}/webitel"
    state: directory
    mode: "0755"
    recurse: false

- name: Check whether the webitel database already has tables
  community.postgresql.postgresql_query:
    db: "{{ postgres_common_db }}"
    login_host: "{{ postgres_common_login_host | default(omit, true) }}"
    login_user: "{{ postgres_common_login_user | default(omit, true) }}"
    login_password: "{{ postgres_common_login_password | default(omit, true) }}"
    query: >-
      SELECT count(*) AS n FROM pg_catalog.pg_tables
      WHERE schemaname NOT IN ('pg_catalog', 'information_schema')
  become: true
  become_user: postgres
  register: postgres_common_existing_tables

- name: Restore webitel schema and data
  community.postgresql.postgresql_db:
    name: "{{ postgres_common_db }}"
    owner: "{{ postgres_common_app_user }}"
    state: restore
    target: "{{ item }}"
    login_host: "{{ postgres_common_login_host | default(omit, true) }}"
    login_user: "{{ postgres_common_login_user | default(omit, true) }}"
    login_password: "{{ postgres_common_login_password | default(omit, true) }}"
  loop: "{{ postgres_common_schema_files }}"
  become: true
  become_user: postgres
  when: (postgres_common_existing_tables.query_result[0].n | int) == 0

- name: Transfer webitel objects to the application user
  community.postgresql.postgresql_script:
    db: "{{ postgres_common_db }}"
    login_host: "{{ postgres_common_login_host | default(omit, true) }}"
    login_user: "{{ postgres_common_login_user | default(omit, true) }}"
    login_password: "{{ postgres_common_login_password | default(omit, true) }}"
    path: "{{ postgres_common_reassign_owner_file }}"
  become: true
  become_user: postgres
  register: postgres_common_reassign_owner
  changed_when: (postgres_common_reassign_owner.query_result[0].changed | int) > 0

- name: Revoke superuser from the application user
  community.postgresql.postgresql_user:
    name: "{{ postgres_common_app_user }}"
    role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE
    login_db: postgres
    login_host: "{{ postgres_common_login_host | default(omit, true) }}"
    login_user: "{{ postgres_common_login_user | default(omit, true) }}"
    login_password: "{{ postgres_common_login_password | default(omit, true) }}"
  become: true
  become_user: postgres

- name: Create OpenSIPS proxy user
  community.postgresql.postgresql_user:
    name: opensips_proxy
    password: "{{ postgres_common_proxy_password }}"
    role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE
    login_db: postgres
    login_host: "{{ postgres_common_login_host | default(omit, true) }}"
    login_user: "{{ postgres_common_login_user | default(omit, true) }}"
    login_password: "{{ postgres_common_login_password | default(omit, true) }}"
  no_log: true
  become: true
  become_user: postgres

- name: Grant OpenSIPS proxy privileges
  community.postgresql.postgresql_script:
    db: "{{ postgres_common_db }}"
    path: "{{ postgres_common_opensips_proxy_file }}"
    login_host: "{{ postgres_common_login_host | default(omit, true) }}"
    login_user: "{{ postgres_common_login_user | default(omit, true) }}"
    login_password: "{{ postgres_common_login_password | default(omit, true) }}"
  become: true
  become_user: postgres
  changed_when: false
