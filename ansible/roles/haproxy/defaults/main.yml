---
haproxy_keyring: /usr/share/keyrings/haproxy.gpg
haproxy_apt_branch: "3.2"

haproxy_bind_addr: "0.0.0.0"

haproxy_backends: >-
  {{ (groups['patroni'] | default([]))
     if (_topology_db_scope | default('dc')) == 'global'
     else ((groups['patroni'] | default([])
            | map('extract', hostvars)
            | selectattr('datacenter', 'defined')
            | selectattr('datacenter', '==', datacenter)
            | map(attribute='inventory_hostname') | list)
           or (groups['patroni'] | default([]))) }}

haproxy_rabbitmq_backends: >-
  {{ (groups['rabbitmq'] | default([])
      | map('extract', hostvars)
      | selectattr('datacenter', 'defined')
      | selectattr('datacenter', '==', datacenter)
      | map(attribute='inventory_hostname') | list)
     or (groups['rabbitmq'] | default([])) }}

haproxy_consul_dns: "127.0.0.1:8600"

# Set to master for Patroni older than 3.0.
haproxy_pg_primary_tag: primary

# dns | patroni
haproxy_pg_rw_check: dns
haproxy_pg_check_inter: 2s
haproxy_pg_check_tls: "{{ consul_pki_enabled | default(false) }}"
haproxy_pg_replica_tag: replica

haproxy_metrics_enabled: false
haproxy_metrics_port: 8405
