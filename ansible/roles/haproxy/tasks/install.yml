---
- name: Download HAProxy archive keyring
  vars:
    _mirror_auth: "{{ apt_mirror_host | length > 0 and (haproxy_apt_key_url | urlsplit('hostname')) == apt_mirror_host }}"
  ansible.builtin.get_url:
    url: "{{ haproxy_apt_key_url }}"
    url_username: "{{ apt_mirror_username if _mirror_auth | bool else omit }}"
    url_password: "{{ apt_mirror_password if _mirror_auth | bool else omit }}"
    force_basic_auth: "{{ _mirror_auth | bool }}"
    dest: "{{ haproxy_keyring }}"
    mode: "0644"
  register: haproxy_keyring_dl
  until: haproxy_keyring_dl is succeeded
  retries: 5
  delay: 2

- name: Add HAProxy repository
  ansible.builtin.deb822_repository:
    name: haproxy
    types: [deb]
    uris: "{{ haproxy_apt_uri }}"
    suites: "{{ ansible_facts.distribution_release }}-backports-{{ haproxy_apt_branch }}"
    components: main
    signed_by: "{{ haproxy_keyring }}"
    state: present
    enabled: true

- name: Install haproxy
  ansible.builtin.apt:
    name: haproxy
    state: present
    install_recommends: false
    update_cache: true
