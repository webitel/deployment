---
# Creates the prepared queries on the Consul cluster of _consul_target.
- name: Get existing Consul prepared queries
  ansible.builtin.uri:
    url: http://127.0.0.1:8500/v1/query
    method: GET
    return_content: true
  register: _consul_queries
  delegate_to: "{{ _consul_target }}"
  check_mode: false

- name: Create Consul prepared queries (if absent)
  ansible.builtin.uri:
    url: http://127.0.0.1:8500/v1/query
    method: POST
    body_format: json
    body:
      Name: "{{ item.name }}"
      Service:
        Service: "{{ item.service }}"
        OnlyPassing: true
    status_code: 200
  loop:
    - { name: "webitel-api", service: "go.webitel.api" }
    - { name: "webitel-messages-bot", service: "webitel.chat.bot" }
  loop_control:
    label: "{{ _consul_target }}/{{ item.name }}"
  when: item.name not in (_consul_queries.json | default([]) | map(attribute='Name') | list)
  delegate_to: "{{ _consul_target }}"
