---
- name: Download HashiCorp GPG key
  vars:
    _mirror_auth: "{{ apt_mirror_host | length > 0 and (consul_apt_key_url | urlsplit('hostname')) == apt_mirror_host }}"
  ansible.builtin.get_url:
    url: "{{ consul_apt_key_url }}"
    url_username: "{{ apt_mirror_username if _mirror_auth | bool else omit }}"
    url_password: "{{ apt_mirror_password if _mirror_auth | bool else omit }}"
    force_basic_auth: "{{ _mirror_auth | bool }}"
    dest: /tmp/hashicorp.gpg.asc
    mode: "0644"
    force: true
  register: consul_hashicorp_key
  until: consul_hashicorp_key is succeeded
  retries: 5
  delay: 2

- name: Dearmor HashiCorp GPG key
  ansible.builtin.command:
    cmd: gpg --batch --yes --dearmor -o /tmp/hashicorp.dearmored /tmp/hashicorp.gpg.asc
  changed_when: false
  check_mode: false

- name: Install HashiCorp GPG key
  ansible.builtin.copy:
    src: /tmp/hashicorp.dearmored
    dest: "{{ consul_keyring }}"
    remote_src: true
    mode: "0644"

- name: Add HashiCorp repository
  ansible.builtin.deb822_repository:
    name: hashicorp
    types: [deb]
    uris: "{{ consul_apt_uri }}"
    suites: "{{ ansible_facts.distribution_release }}"
    components: main
    signed_by: "{{ consul_keyring }}"
    state: present
    enabled: true

- name: Install consul
  ansible.builtin.apt:
    name: consul
    state: present
    install_recommends: false
    update_cache: true
