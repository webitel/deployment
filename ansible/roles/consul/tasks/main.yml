---
- name: Install consul
  ansible.builtin.include_tasks:
    file: install.yml
    apply:
      tags: [consul_install]
  tags: [consul_install]

- name: Configure consul
  ansible.builtin.include_tasks:
    file: configure.yml
    apply:
      tags: [consul_configure]
  tags: [consul_configure]

- name: Configure consul DNS forwarding
  ansible.builtin.include_tasks:
    file: dns.yml
    apply:
      tags: [consul_dns]
  when: consul_dns_forward | bool
  tags: [consul_dns]
