---
- name: Download ngcp-keyring-latest.deb
  vars:
    _mirror_auth: "{{ apt_mirror_host | length > 0 and (rtpengine_keyring_deb_url | urlsplit('hostname')) == apt_mirror_host }}"
  ansible.builtin.get_url:
    url: "{{ rtpengine_keyring_deb_url }}"
    url_username: "{{ apt_mirror_username if _mirror_auth | bool else omit }}"
    url_password: "{{ apt_mirror_password if _mirror_auth | bool else omit }}"
    force_basic_auth: "{{ _mirror_auth | bool }}"
    dest: /tmp/ngcp-keyring-latest.deb
    mode: "0644"
    force: false
  register: rtpengine_keyring_download
  until: rtpengine_keyring_download is succeeded
  retries: 5
  delay: 2

- name: Install ngcp-keyring package
  ansible.builtin.apt:
    deb: /tmp/ngcp-keyring-latest.deb
    state: present

- name: Add RTPEngine sipwise APT repository
  ansible.builtin.deb822_repository:
    name: rtpengine
    types: [deb]
    uris: "{{ rtpengine_apt_uri }}"
    suites: "{{ ansible_facts.distribution_release }}"
    components: main
    state: present
    enabled: true

- name: Install RTPEngine packages
  ansible.builtin.apt:
    name:
      - libspandsp2
      - ngcp-rtpengine
      - "linux-headers-{{ ansible_facts.kernel }}"
    state: present
    install_recommends: false
    update_cache: true
