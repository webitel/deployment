---
- name: Add the nginx.org repository
  when: nginx_apt_uri | length > 0
  block:
    - name: Download nginx.org GPG key
      vars:
        _mirror_auth: "{{ apt_mirror_host | length > 0 and (nginx_apt_key_url | urlsplit('hostname')) == apt_mirror_host }}"
      ansible.builtin.get_url:
        url: "{{ nginx_apt_key_url }}"
        url_username: "{{ apt_mirror_username if _mirror_auth | bool else omit }}"
        url_password: "{{ apt_mirror_password if _mirror_auth | bool else omit }}"
        force_basic_auth: "{{ _mirror_auth | bool }}"
        dest: /tmp/nginx.gpg.asc
        mode: "0644"
        force: true
      register: nginx_gpg_key
      until: nginx_gpg_key is succeeded
      retries: 5
      delay: 2

    - name: Dearmor nginx.org GPG key
      ansible.builtin.command:
        cmd: gpg --batch --yes --dearmor -o /tmp/nginx.dearmored /tmp/nginx.gpg.asc
      changed_when: false
      check_mode: false

    - name: Install nginx.org GPG key
      ansible.builtin.copy:
        src: /tmp/nginx.dearmored
        dest: "{{ nginx_keyring }}"
        remote_src: true
        mode: "0644"

    - name: Add nginx.org APT repository
      ansible.builtin.deb822_repository:
        name: nginx
        types: [deb]
        uris: "{{ nginx_apt_uri }}"
        suites: "{{ ansible_facts.distribution_release }}"
        components: nginx
        signed_by: "{{ nginx_keyring }}"
        state: present
        enabled: true

- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    install_recommends: false
    update_cache: "{{ nginx_apt_uri | length > 0 }}"

# The nginx.org package ships conf.d/default.conf instead of sites-enabled/.
- name: Ensure sites-enabled exists
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Remove the nginx.org default site
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  notify: restart nginx
