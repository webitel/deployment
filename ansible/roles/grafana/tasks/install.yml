---
- name: Download Grafana GPG key
  vars:
    _mirror_auth: "{{ apt_mirror_host | length > 0 and (grafana_apt_key_url | urlsplit('hostname')) == apt_mirror_host }}"
  ansible.builtin.get_url:
    url: "{{ grafana_apt_key_url }}"
    url_username: "{{ apt_mirror_username if _mirror_auth | bool else omit }}"
    url_password: "{{ apt_mirror_password if _mirror_auth | bool else omit }}"
    force_basic_auth: "{{ _mirror_auth | bool }}"
    dest: /tmp/grafana.gpg.asc
    mode: "0644"
    force: true
  register: grafana_gpg_key
  until: grafana_gpg_key is succeeded
  retries: 5
  delay: 2

- name: Dearmor Grafana GPG key
  ansible.builtin.command:
    cmd: gpg --batch --yes --dearmor -o /tmp/grafana.dearmored /tmp/grafana.gpg.asc
  changed_when: false
  check_mode: false

- name: Install Grafana GPG key
  ansible.builtin.copy:
    src: /tmp/grafana.dearmored
    dest: "{{ grafana_keyring }}"
    remote_src: true
    mode: "0644"

- name: Add Grafana APT repository
  ansible.builtin.deb822_repository:
    name: grafana
    types: [deb]
    uris: "{{ grafana_apt_uri }}"
    suites: stable
    components: main
    signed_by: "{{ grafana_keyring }}"
    state: present
    enabled: true

- name: Install grafana
  ansible.builtin.apt:
    name: grafana
    state: present
    install_recommends: false
    update_cache: true
