---
- name: Download Grafana GPG key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /tmp/grafana.gpg.asc
    mode: "0644"
    force: true
  register: grafana_gpg_key
  until: grafana_gpg_key is succeeded
  retries: 5
  delay: 2

- name: Dearmor Grafana GPG key
  ansible.builtin.command:
    cmd: gpg --batch --yes --dearmor -o /tmp/grafana.dearmored /tmp/grafana.gpg.asc
  changed_when: false
  check_mode: false

- name: Install Grafana GPG key
  ansible.builtin.copy:
    src: /tmp/grafana.dearmored
    dest: "{{ grafana_keyring }}"
    remote_src: true
    mode: "0644"

- name: Add Grafana APT repository
  ansible.builtin.deb822_repository:
    name: grafana
    types: [deb]
    uris: "https://apt.grafana.com"
    suites: stable
    components: main
    signed_by: "{{ grafana_keyring }}"
    state: present
    enabled: true

- name: Install grafana
  ansible.builtin.apt:
    name: grafana
    state: present
    install_recommends: false
    update_cache: true
