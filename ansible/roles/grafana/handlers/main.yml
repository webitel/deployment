---
- name: Read grafana state for restart
  ansible.builtin.systemd_service:
    name: grafana-server
  register: _grafana_handler_state
  listen: restart grafana

# Skips the standby DC; under nomad restarts only where Nomad runs it.
- name: Restart grafana
  ansible.builtin.systemd_service:
    name: grafana-server
    state: restarted
    daemon_reload: true
  when: >-
    (nomad_managed | default(false)) and _grafana_handler_state.status.ActiveState == 'active'
    or (not (nomad_managed | default(false)) and grafana_active | bool)
  listen: restart grafana

- name: Set privileges on provisioned dashboards files
  ansible.builtin.file:
    path: /var/lib/grafana/dashboards
    recurse: true
    owner: grafana
    group: grafana
    mode: "0640"
  listen: provisioned dashboards changed

- name: Set privileges on provisioned dashboards directory
  ansible.builtin.file:
    path: /var/lib/grafana/dashboards
    state: directory
    recurse: false
    mode: "0755"
  listen: provisioned dashboards changed
