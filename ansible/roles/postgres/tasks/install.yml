---
- name: Install standalone-only packages
  ansible.builtin.apt:
    name:
      - timescaledb-tools
    state: present
    install_recommends: false
    update_cache: true

- name: Read postgresql.conf checksum before tuning
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      grep -v '^timescaledb.last_tuned' /etc/postgresql/{{ postgres_major }}/main/postgresql.conf | sha256sum
    executable: /bin/bash
  register: _postgres_conf_before
  changed_when: false
  check_mode: false

- name: Run timescaledb-tune
  ansible.builtin.command:
    cmd: >-
      timescaledb-tune --quiet --yes
      --pg-version={{ postgres_major }}
      --conf-path=/etc/postgresql/{{ postgres_major }}/main/postgresql.conf
  changed_when: false

- name: Read postgresql.conf checksum after tuning
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      grep -v '^timescaledb.last_tuned' /etc/postgresql/{{ postgres_major }}/main/postgresql.conf | sha256sum
    executable: /bin/bash
  register: _postgres_conf_after
  changed_when: false
  check_mode: false

- name: Restart PostgreSQL when timescaledb-tune changed postgresql.conf
  ansible.builtin.debug:
    msg: postgresql.conf changed
  changed_when: _postgres_conf_before.stdout != _postgres_conf_after.stdout
  notify: restart postgresql
