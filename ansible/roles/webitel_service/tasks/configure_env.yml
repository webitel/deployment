---
# Also uncomments a commented-out default line.
- name: "Set env keys in {{ webitel_env_block.path }}"
  ansible.builtin.lineinfile:
    path: "{{ webitel_env_block.path }}"
    regexp: "^#?\\s*{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    backrefs: false
  loop: "{{ (webitel_env_block.env | default({}) | combine(webitel_service_env_extra | default({}))) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: "{{ item.key is search('PASS|SECRET|TOKEN|KEY') or (item.value | string) is search('://[^/@]+@') }}"
  diff: false
  notify: restart webitel service
