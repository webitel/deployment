---
base_packages:
  - acl
  - curl
  - wget
  - unzip
  - gnupg
  - locales
  - dnsutils
  - python3-psycopg2
  - python3-debian
  - cron
base_locales: "{{ locales_gen | default(['en_US.UTF-8']) }}"
base_sysctl:
  net.ipv6.conf.all.disable_ipv6: "1"
  net.ipv6.conf.default.disable_ipv6: "1"
  net.ipv6.conf.lo.disable_ipv6: "1"
  fs.file-max: "1000000"
  vm.max_map_count: "262144"
base_repo_keyring: /usr/share/keyrings/webitel-apt-repo.gpg
webitel_repo_s3_bucket: webitel-apt-repo # noqa: var-naming[no-role-prefix]
webitel_repo_s3_region: eu-central-1 # noqa: var-naming[no-role-prefix]
webitel_repo_s3_access_key: "{{ vault_webitel_repo_s3_access_key }}" # noqa: var-naming[no-role-prefix]
webitel_repo_s3_secret_key: "{{ vault_webitel_repo_s3_secret_key }}" # noqa: var-naming[no-role-prefix]
# Repo components added next to the release component.
base_repo_extra_components: [main]
# Empty keeps the host setting.
base_timezone: UTC
# systemd-timesyncd servers; empty keeps the host setting.
base_ntp_servers: []
