---
- name: Write APT mirror credentials
  ansible.builtin.copy:
    dest: /etc/apt/auth.conf.d/mirror.conf
    content: "machine {{ apt_mirror_host }} login {{ apt_mirror_username }} password {{ apt_mirror_password }}\n"
    owner: root
    group: root
    mode: "0600"
  diff: false
  no_log: true
  when: apt_mirror_host | length > 0

- name: Remove APT mirror credentials
  ansible.builtin.file:
    path: /etc/apt/auth.conf.d/mirror.conf
    state: absent
  when: apt_mirror_host | length == 0

- name: Render S3 auth config
  ansible.builtin.template:
    src: s3auth.conf.j2
    dest: /etc/apt/s3auth.conf
    owner: root
    group: root
    mode: "0600"
  diff: false
  when: base_repo_s3 | bool

- name: Copy Webitel APT GPG public key (armored)
  ansible.builtin.copy:
    src: webitel-apt-repo.gpg.pub
    dest: /tmp/webitel-apt-repo.gpg.pub
    mode: "0644"
  register: base_repo_key
  when: webitel_repo_key_url | length == 0

- name: Download Webitel APT GPG public key (armored)
  vars:
    _mirror_auth: "{{ apt_mirror_host | length > 0 and (webitel_repo_key_url | urlsplit('hostname')) == apt_mirror_host }}"
  ansible.builtin.get_url:
    url: "{{ webitel_repo_key_url }}"
    url_username: "{{ apt_mirror_username if _mirror_auth | bool else omit }}"
    url_password: "{{ apt_mirror_password if _mirror_auth | bool else omit }}"
    force_basic_auth: "{{ _mirror_auth | bool }}"
    dest: /tmp/webitel-apt-repo.gpg.pub
    mode: "0644"
    force: true
  register: base_repo_key_download
  until: base_repo_key_download is succeeded
  retries: 5
  delay: 2
  when: webitel_repo_key_url | length > 0

- name: Dearmor Webitel APT GPG key
  ansible.builtin.command:
    cmd: gpg --batch --yes --dearmor -o /tmp/webitel-apt-repo.dearmored /tmp/webitel-apt-repo.gpg.pub
  changed_when: false
  check_mode: false

- name: Install Webitel APT GPG key
  ansible.builtin.copy:
    src: /tmp/webitel-apt-repo.dearmored
    dest: "{{ base_repo_keyring }}"
    remote_src: true
    mode: "0644"

- name: Add Webitel S3 APT repository
  ansible.builtin.deb822_repository:
    name: webitel
    types: [deb]
    uris: "{{ webitel_repo_uri }}"
    suites: "{{ ansible_facts.distribution_release }}"
    components: "{{ [webitel_release_component] + base_repo_extra_components }}"
    signed_by: "{{ base_repo_keyring }}"
    state: present
    enabled: true

- name: Update apt cache after adding Webitel repository
  ansible.builtin.apt:
    update_cache: true
