---
- name: Write Webitel env keys with secret values
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    webitel_env_block:
      path: "{{ env_file }}"
      env:
        LOG_LVL: info
        DATA_SOURCE: postgres://webitel:Canary-7f3a9c-secret@127.0.0.1:5432/webitel
        AMQP: amqp://webitel:Canary-7f3a9c-secret@127.0.0.1:5672
        WBTL_COOKIE_KEYS: Canary-7f3a9c-secret
  tasks:
    - name: Create env file
      ansible.builtin.copy:
        dest: "{{ env_file }}"
        content: "LOG_LVL=debug\nDATA_SOURCE=\nAMQP=\nWBTL_COOKIE_KEYS=\n"
        mode: "0600"

    - name: Set env keys
      ansible.builtin.include_tasks: ../roles/webitel_service/tasks/configure_env.yml

  handlers:
    - name: Restart webitel service
      listen: restart webitel service
      ansible.builtin.meta: noop
