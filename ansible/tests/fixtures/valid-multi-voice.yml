---
# Several opensips and rtpengine hosts in one datacenter.
all:
  vars:
    topology_profile: failover
    dns_upstream_servers: [10.0.0.1]
  children:
    dc1:
      vars:
        datacenter: dc1
      hosts:
        db1: {}
        db2: {}
        db3: {}
        sip1: {}
        sip2: {}
        rtp1: {}
        rtp2: {}
    patroni:
      hosts:
        db1: {}
        db2: {}
        db3: {}
    consul_server:
      hosts:
        db1: {}
        db2: {}
        db3: {}
    rabbitmq:
      hosts:
        db1: {}
        db2: {}
        db3: {}
    opensips:
      hosts:
        sip1: {}
        sip2: {}
    rtpengine:
      hosts:
        rtp1: {}
        rtp2: {}
    consul_agent:
      hosts:
        sip1: {}
        sip2: {}
        rtp1: {}
        rtp2: {}
    freeswitch:
      hosts:
        rtp1: {}
        rtp2: {}
