---
all:
  vars:
    topology_profile: warm_standby
    dns_upstream_servers: [10.0.0.1]
    primary_datacenter: dc_a
  children:
    dc_a:
      vars: {datacenter: dc_a, freeswitch_dispatcher_setid: 1, rtpengine_setid: 1}
      hosts:
        a1:
          services: [consul_server, patroni]
        a2:
          services: [consul_server, patroni]
        a3:
          services: [consul_server, patroni]
        a_sip:
          services: [consul_agent, opensips, freeswitch, rtpengine]
        a_rtp:
          services: [consul_agent, rtpengine]
          rtpengine_setid: 3
    dc_b:
      vars: {datacenter: dc_b, freeswitch_dispatcher_setid: 2, rtpengine_setid: 2}
      hosts:
        b1:
          services: [consul_server, patroni]
        b2:
          services: [consul_server, patroni]
        b3:
          services: [consul_server, patroni]
        b_sip:
          services: [consul_agent, opensips, freeswitch, rtpengine]
