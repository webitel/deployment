---
# An app host outside nomad_client while other hosts are nomad_client.
all:
  vars:
    topology_profile: multihost
    dns_upstream_servers: [10.0.0.1]
  children:
    dc1:
      vars:
        datacenter: dc1
      hosts:
        app1: {}
        app2: {}
    consul_server:
      hosts:
        app1: {}
    nomad_server:
      hosts:
        app1: {}
    nomad_client:
      hosts:
        app1: {}
    webitel_engine:
      hosts:
        app1: {}
        app2: {}
    consul_agent:
      hosts:
        app2: {}
    rabbitmq:
      hosts:
        app1: {}
