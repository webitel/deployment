---
all:
  vars:
    topology_profile: warm_standby
    primary_datacenter: dc1
    dns_upstream_servers: [10.0.0.1]
  hosts:
  children:
    dc1:
      vars:
        datacenter: dc1
      hosts:
        a1: {services: [patroni, consul_server, webitel_dcctl, nginx, webitel_frontend]}
        a2: {services: [patroni, consul_server]}
        a3: {services: [patroni, consul_server]}
        arb1: {services: [webitel_dcctl_arbiter]}
    dc2:
      vars:
        datacenter: dc2
      hosts:
        b1: {services: [patroni, consul_server, webitel_dcctl, nginx, webitel_frontend]}
        b2: {services: [patroni, consul_server]}
        b3: {services: [patroni, consul_server]}
