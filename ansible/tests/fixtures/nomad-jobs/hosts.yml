---
all:
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    dc_a:
      vars:
        datacenter: dc_a
        nomad_jobs_api_url: "http://127.0.0.1:{{ dc_a_port }}"
      hosts:
        a_server:
        a_client:
          services: [freeswitch, opensips, webitel_core]
    dc_b:
      vars:
        datacenter: dc_b
        nomad_jobs_api_url: "http://127.0.0.1:{{ dc_b_port }}"
      hosts:
        b_server:
        b_client:
          services: [freeswitch, opensips, webitel_core]
    nomad_server:
      hosts:
        a_server:
        b_server:
    nomad_client:
      hosts:
        a_client:
        b_client:
