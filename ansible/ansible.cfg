[defaults]
inventory = inventories/singlehost.example
roles_path = roles
inventory_plugins = plugins/inventory
interpreter_python = auto_silent
forks = 10
timeout = 30
host_key_checking = False
retry_files_enabled = False
local_tmp = .ansible/tmp

gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible/facts
fact_caching_timeout = 7200

[inventory]
enable_plugins = webitel_services, host_list, auto, yaml, ini, toml

ignore_extensions = .pyc, .pyo, .swp, .bak, ~, .rpm, .md, .txt, .rst, .orig, .cfg, .retry, .pem, .csr, .key
ignore_patterns = ^pki$, ^storage$

[ssh_connection]
pipelining = True

retries = 3
